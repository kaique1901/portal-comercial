server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /full chega a centenas de MB de JSON e alguns /recorte levam ~20s no banco.
    # Os defaults do nginx nao servem para esse trafego:
    #   proxy_buffering on   -> bufferiza a resposta inteira em disco antes de
    #                           repassar, o que atrasa o primeiro byte e enche /tmp;
    #   proxy_read_timeout 60s -> corta a consulta longa com 504.
    # gzip derruba o JSON a uma fracao do tamanho — decisivo quando o acesso vem
    # pela internet, e nao mais pela porta 4001 exposta na rede local.
    location /api/ {
        proxy_pass http://api:4001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        gzip on;
        gzip_proxied any;
        gzip_min_length 1024;
        gzip_types application/json;
    }

    # Mesmo motivo do public/serve.json no ambiente local, e aqui a armadilha e
    # pior: sem Cache-Control explicito, a borda respondia
    # `cache-control: max-age=35182` (~10h) para /js/app.js, entao o navegador
    # continuava executando o app.js ANTIGO depois do deploy sem sequer revalidar
    # — o sintoma e alguem depurando um bug que ja nao existe no codigo.
    # `no-cache` nao desliga o cache: obriga a revalidar. Com o ETag intacto, o
    # que nao mudou volta como 304 vazio.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
