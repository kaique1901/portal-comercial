# Pipeline de Dados e Mapeamento de Campos

Este documento descreve o fluxo atual de dados do projeto web e especifica quais campos da base de dados (PostgreSQL) são consumidos para gerar os indicadores (JSON), servindo como base para a futura construção de uma API.

## Fluxo Atual (Pipeline)

O Portal consome TODOS os dados da API, que agrega direto do banco PostgreSQL. Não há mais planilhas Excel nem arquivos estáticos no caminho:

```mermaid
graph TD
    A[(PostgreSQL: DB_CifalComercial)] -->|ETL: queries GROUP BY| B(API Node/Express<br/>cache em memória)
    B -->|GET /api/v1/dashboard/full| C[Portal Web<br/>Dashboard, Gráficos, Tabelas]
```

A API materializa o cubo de vendas do período numa TEMP TABLE e faz o JOIN das tabelas transacionais (Pedidos, Vendedores) com as de classificação (Produtos, Categorias, Grupos) direto na origem, devolvendo o JSON já agregado que o Portal renderiza em tempo real.

O projeto web **não** lê os dados granulares (linha a linha). Ele consome o JSON **já agregado** servido pela API (somado e consolidado por mês, por dia, por categoria, por gerente, etc.).

O Dashboard web consulta os dados agregados diretamente da API, que por sua vez consulta o Banco de Dados — em tempo real, sem etapa de planilhas ou arquivos estáticos.

## Mapeamento de Campos: Regra de Negócio vs. Banco de Dados

Para garantir a precisão total na construção da futura API, abaixo está o mapeamento exato de como as métricas e dimensões de negócio se traduzem em tabelas e campos do banco PostgreSQL (`DB_CifalComercial`), conforme a query SQL original.

### 1. Campos de Valor e Medida (Métricas)
Estes campos requerem cálculos e somas em nível de banco de dados.
- **Receita / Faturamento:** Calculado subtraindo o desconto do valor total dos itens. 
  - *Tabela:* `ItensPedido`
  - *Fórmula SQL:* `(ItensPedido.Qtde * ItensPedido.ValUni) * (1 - (TotDescontoNota/TotProdutos))` (Nomeado como `Total`)
- **Custo:** Valor de custo do item vendido.
  - *Tabela:* `ItensPedido`
  - *Fórmula SQL:* `itenspedido.qtde * itenspedido.customedio` (Nomeado como `customedio`)
- **Quantidade:** Quantidade vendida considerando o fator de embalagem padrão.
  - *Tabelas:* `ItensPedido` JOIN `UnidadeAlt`
  - *Fórmula SQL:* `(ItensPedido.Qtde * UnidadeAlt.QdeEmb) / upadrao.qdeemb` (Nomeado como `Qtde`)
- **Peso:** Peso físico líquido do produto vendido.
  - *Tabelas:* `ItensPedido` JOIN `UnidadeAlt`
  - *Fórmula SQL:* `ItensPedido.Qtde * UnidadeAlt.PesoLiq` (Nomeado como `Peso`)

### 2. Campos de Dimensão e Tempo (Agrupadores)
Usados para agrupar as somas e filtrar dados por períodos e responsáveis.
- **Data de Faturamento:** 
  - *Tabela:* `Pedidos`
  - *Campo SQL:* `Pedidos.DataFechamento` (Nomeado como `DataPed`)
- **Gerente:** 
  - *Tabela:* `Gerente`
  - *Campo SQL:* `gerente.nomegerente` (Nomeado como `gerente`)
- **Supervisor:** 
  - *Tabela:* `Supervisor`
  - *Campo SQL:* `supervisor.nomesupervisor` (Nomeado como `supervisor`)

### 3. Campos de Classificação (Dimensões de Produtos)
Esses campos dispensam mapeamentos manuais (PROCVs), pois já vêm nativamente consolidados via `JOINs`.
- **Categoria do Produto:**
  - *Tabela:* `categoriasproduto`
  - *Campo SQL:* `descategoriaprod` (Nomeado como `categoria`)
- **Grupo do Produto:** 
  - *Tabela:* `SubGrupos`
  - *Campo SQL:* `DesSubGrupo` (Nomeado como `Grupo`)

### 4. Campos de Identificação Única (Contagens Distintas)
Usados para as contagens unívocas no Dashboard (KPIs como total de pedidos, total de clientes positivados, etc).
- **ID do Pedido:** `Pedidos.NroPedido` (Nomeado como `NroPed`)
- **ID do Cliente:** `Pedidos.CodCliente` (Nomeado como `CodCli`)
- **ID do Vendedor:** `Pedidos.CodVendedor` (Nomeado como `CodVen`)
- **ID do Produto:** `ItensPedido.CodProduto` (Nomeado como `Codigo`)

## Visão da Estrutura da Futura API

Quando a API for desenvolvida, ela terá *endpoints* que farão o trabalho de agregação que hoje é feito antes de gerar o arquivo JSON. As queries da API farão os `JOINs` supracitados e aplicarão um `GROUP BY` conforme a dimensão requisitada.

**Exemplo de Arquitetura da API:**
- `GET /api/v1/dashboard/resumo?periodo=2026_1` -> Retorna totais gerais consolidados.
- `GET /api/v1/dashboard/vendas-por-dia?periodo=2026_1` -> Retorna array de dias com receita e custo (usando `GROUP BY Pedidos.DataFechamento`).
- `GET /api/v1/dashboard/categorias?periodo=2026_1` -> Retorna as agregações por categoria (usando `GROUP BY descategoriaprod`).
- `GET /api/v1/dashboard/hierarquia?periodo=2026_1` -> Retorna dados de Gerentes e Supervisores (usando `GROUP BY gerente.nomegerente, supervisor.nomesupervisor`).

A API alimenta o Dashboard em tempo real, direto do banco de dados.
