version: '3.8'

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: cifal_api
    restart: unless-stopped
    environment:
      PORT: ${PORT:-4001}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    networks:
      - cifal_network

  frontend:
    build:
      context: ./public
      dockerfile: Dockerfile
    container_name: cifal_frontend
    restart: unless-stopped
    ports:
      - "3006:80"
    networks:
      - cifal_network

networks:
  cifal_network:
    driver: bridge
